name: Publish FFmpeg and deploy EdgeOne

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Redeploy the current release even if already deployed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [scripts/**, tests/**, .github/workflows/sync.yml, package.json, package-lock.json]
  pull_request:
    paths: [scripts/**, tests/**, .github/workflows/sync.yml, package.json, package-lock.json]

permissions:
  contents: read

concurrency:
  group: ffmpeg-mirror-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'ffmpeg-mirror' }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      deploy: ${{ steps.publish.outputs.deploy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build verified full XZ packages and publish GitHub Release
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        shell: bash
        run: |
          args=()
          if [[ "$FORCE_DEPLOY" == 'true' ]]; then args+=(--force); fi
          python scripts/publish.py prepare "${args[@]}"

  deploy:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download full Release packages, split, verify and deploy to China
        env:
          GH_TOKEN: ${{ github.token }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          MIRROR_TAG: ${{ needs.release.outputs.tag }}
        run: python scripts/publish.py deploy --tag "$MIRROR_TAG"
